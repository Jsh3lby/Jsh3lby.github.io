<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Access Granted</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-0: #030606;
      --bg-1: #07150e;
      --line: rgba(25, 255, 150, 0.06);
      --text-main: #b8ffd8;
      --text-strong: #66ffab;
      --text-soft: #7fc79f;
      --card-border: rgba(102, 255, 171, 0.3);
      --card-shadow: rgba(102, 255, 171, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Share Tech Mono", monospace;
      color: var(--text-main);
      background:
        radial-gradient(circle at 15% 20%, rgba(102, 255, 171, 0.08), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(102, 255, 171, 0.08), transparent 50%),
        linear-gradient(150deg, var(--bg-0), var(--bg-1));
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: linear-gradient(to bottom, transparent 50%, var(--line) 50%);
      background-size: 100% 3px;
      pointer-events: none;
      opacity: 0.8;
      animation: drift 10s linear infinite;
    }

    .terminal {
      width: min(760px, 100%);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      background: rgba(3, 8, 6, 0.82);
      backdrop-filter: blur(2px);
      box-shadow: 0 0 40px -10px var(--card-shadow);
      animation: rise 650ms ease-out;
    }

    .terminal-header {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(102, 255, 171, 0.2);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(184, 255, 216, 0.5);
    }

    .terminal-body {
      padding: 28px 22px;
      line-height: 1.7;
      font-size: clamp(1rem, 2vw, 1.2rem);
    }

    .lang-inline {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .lang-inline button {
      border: 1px solid rgba(102, 255, 171, 0.35);
      background: rgba(102, 255, 171, 0.08);
      color: var(--text-main);
      border-radius: 6px;
      padding: 4px 8px;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .lang-inline button.active {
      color: var(--text-strong);
      border-color: rgba(102, 255, 171, 0.75);
      background: rgba(102, 255, 171, 0.18);
    }

    .prompt {
      color: var(--text-strong);
      margin-right: 10px;
    }

    p + p {
      margin-top: 12px;
    }

    .cursor {
      display: inline-block;
      width: 11px;
      height: 1.1em;
      vertical-align: -0.15em;
      margin-left: 5px;
      background: var(--text-strong);
      animation: blink 1.1s steps(1, end) infinite;
    }

    .small {
      margin-top: 18px;
      color: var(--text-soft);
      font-size: 0.95rem;
    }

    a {
      color: var(--text-strong);
      text-decoration: none;
      border-bottom: 1px dotted rgba(102, 255, 171, 0.6);
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    @keyframes drift {
      from {
        transform: translateY(0);
      }
      to {
        transform: translateY(3px);
      }
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .terminal-body {
        padding: 24px 16px;
      }
    }
  </style>
</head>
<body>
  <main class="terminal" aria-label="Hidden hacker message">
    <div class="terminal-header" aria-hidden="true">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

    <section class="terminal-body">
      <div class="lang-inline" role="group" aria-label="Select language">
        <button type="button" data-lang="es">ES</button>
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="fr">FR</button>
      </div>
      <p><span class="prompt">root@Jsh3lby:~$</span><span id="msg-1">Hello fellow hacker.</span></p>
      <p id="msg-2">If you found this page, you probably know what you're doing.</p>
      <p id="msg-3">Responsible disclosure welcome.<span class="cursor" aria-hidden="true"></span></p>
      <p class="small"><span id="msg-4">Return to</span> <a href="../" id="msg-5">home</a>.</p>
    </section>
  </main>

  <script>
    const HACKER_I18N = {
      es: {
        htmlLang: 'es',
        m1: 'Hola, hacker colega.',
        m2: 'Si encontraste esta pagina, probablemente sabes lo que haces.',
        m3: 'La divulgacion responsable es bienvenida.',
        m4: 'Volver a',
        m5: 'inicio',
        title: 'Acceso concedido'
      },
      en: {
        htmlLang: 'en',
        m1: 'Hello fellow hacker.',
        m2: "If you found this page, you probably know what you're doing.",
        m3: 'Responsible disclosure welcome.',
        m4: 'Return to',
        m5: 'home',
        title: 'Access Granted'
      },
      fr: {
        htmlLang: 'fr',
        m1: 'Bonjour, hacker collegue.',
        m2: 'Si tu as trouve cette page, tu sais probablement ce que tu fais.',
        m3: 'La divulgation responsable est bienvenue.',
        m4: 'Retour a',
        m5: 'accueil',
        title: 'Acces autorise'
      }
    };

    function normalizeLang(lang) {
      if (!lang) return 'es';
      const base = lang.toLowerCase().split('-')[0];
      return HACKER_I18N[base] ? base : 'es';
    }

    function applyHackerLanguage(language) {
      const lang = normalizeLang(language);
      const pack = HACKER_I18N[lang];

      document.documentElement.setAttribute('lang', pack.htmlLang);
      document.title = pack.title;
      document.getElementById('msg-1').textContent = pack.m1;
      document.getElementById('msg-2').textContent = pack.m2;
      document.getElementById('msg-3').childNodes[0].textContent = pack.m3;
      document.getElementById('msg-4').textContent = pack.m4;
      document.getElementById('msg-5').textContent = pack.m5;

      document.querySelectorAll('.lang-inline button').forEach((button) => {
        button.classList.toggle('active', button.dataset.lang === lang);
      });

      try {
        localStorage.setItem('portfolio-language', lang);
      } catch (error) {
        console.warn('No se pudo guardar idioma:', error);
      }
    }

    const storedLanguage = (() => {
      try {
        return localStorage.getItem('portfolio-language');
      } catch (error) {
        return null;
      }
    })();

    const initialLanguage = normalizeLang(storedLanguage || navigator.language || 'en');
    applyHackerLanguage(initialLanguage);

    document.querySelectorAll('.lang-inline button').forEach((button) => {
      button.addEventListener('click', () => {
        applyHackerLanguage(button.dataset.lang);
      });
    });
  </script>
</body>
</html>
